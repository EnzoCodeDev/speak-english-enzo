name: speak-enzo

services:
  speak-enzo-web:
    build: .
    image: portal/speak-enzo-web:${TAG:-dev}
    restart: unless-stopped
    networks: [portal]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  portal:
    external: true
